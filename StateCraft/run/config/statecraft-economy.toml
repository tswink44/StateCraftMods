
#StateCraft Economy Configuration
[economy]
	#Currency Items
	#Format: 'modid:itemname=value'
	#Example: 'minecraft:gold_ingot=100' means 1 gold ingot = 100 units
	#Default currency bills:
	currencyItems = ["statecraft_economy:bill_1=1", "statecraft_economy:bill_10=10", "statecraft_economy:bill_100=100", "statecraft_economy:bill_1000=1000", "statecraft_economy:bill_10000=10000", "statecraft_economy:bill_100000=100000", "statecraft_economy:bill_1000000=1000000"]
	#Starting balance for new players
	#Range: 0.0 ~ 1000000.0
	startingBalance = 100.0
	#DEPRECATED: Interest is now handled per-bank by player-created bank companies.
	#The default Central Bank pays no interest. This setting has no effect.
	#To earn interest, players open accounts at player-created banks.
	enableInterest = false
	#DEPRECATED: Interest rate is now configured per-bank via BankCompany.
	#See [banking] section for default deposit interest rate.
	#Range: 0.0 ~ 0.1
	dailyInterestRate = 0.001
	#Maximum balance a player can have (0 = unlimited)
	#Range: 0.0 ~ 1.7976931348623157E308
	maxBalance = 0.0

#ATM Block Settings
[atm]
	#Whether ATM requires redstone power to function
	requiresPower = false
	#Range in blocks that ATM can be accessed from
	#Range: 1 ~ 16
	range = 5
	#Transaction amount above which a confirmation dialog is shown (0 = disabled).
	#Applies to deposits, withdrawals, and transfers via the ATM GUI.
	#Range: 0.0 ~ 1.7976931348623157E308
	largeTransactionThreshold = 10000.0
	#Bank Card access mode:
	#'full' = Bank Card opens full ATM interface remotely (no physical ATM needed)
	#'balance_only' = Bank Card only shows balance in chat (must visit ATM for transactions)
	bankCardMode = "full"

#Government Spending Limits
#Daily withdrawal/transfer limits from government treasury accounts per role.
#Set to 0 for unlimited. Amounts are in currency units per real-world day.
#Nation leader limit can also be overridden per-nation via legislature policy.
[spendingLimits]
	#Nation leader daily spending limit (0 = unlimited, default)
	#Range: 0.0 ~ 1.7976931348623157E308
	nationLeaderDailyLimit = 0.0
	#Nation officer daily spending limit (was 'nationAdminDailyLimit')
	#Range: 0.0 ~ 1.7976931348623157E308
	nationAdminDailyLimit = 50000.0
	#State governor daily spending limit
	#Range: 0.0 ~ 1.7976931348623157E308
	stateGovernorDailyLimit = 20000.0
	#City mayor daily spending limit
	#Range: 0.0 ~ 1.7976931348623157E308
	cityMayorDailyLimit = 5000.0

#Company Settings
#Configuration for player-created companies.
[companies]
	#Fee to register a new company (paid to the state treasury where HQ is located, 0 = free)
	#Range: 0.0 ~ 1.7976931348623157E308
	registrationFee = 1000.0
	#Maximum number of companies a single player can found (0 = unlimited)
	#Range: 0 ~ 100
	maxCompaniesPerPlayer = 3
	#Corporate tax rate — percentage of company balance collected each tax period (0.0 = no tax, 0.05 = 5%)
	#Range: 0.0 ~ 1.0
	companyTaxRate = 0.02
	#Daily spending limit for company officers withdrawing/transferring from company treasury (0 = unlimited)
	#Range: 0.0 ~ 1.7976931348623157E308
	companyOfficerDailyLimit = 20000.0

#Banking Settings
#Configuration for bank-type companies. Banks hold depositor funds,
#pay interest, and offer loans with a fractional reserve system.
[banking]
	#Default fractional reserve ratio — minimum fraction of total deposits a bank must keep in treasury.
	#This is the global minimum; national legislature policy can set a higher floor per-nation.
	#0.20 = 20%, meaning the bank can lend out up to 80% of deposits.
	#Range: 0.0 ~ 1.0
	defaultReserveRatio = 0.2
	#Maximum loan amount a player can borrow from a single bank (0 = unlimited)
	#Range: 0.0 ~ 1.7976931348623157E308
	maxLoanAmount = 0.0
	#Maximum number of active loans a player can have at a single bank (0 = unlimited)
	#Range: 0 ~ 100
	maxActiveLoansPerPlayer = 3
	#Number of consecutive missed loan payments before a loan defaults (triggers seizure/repossession)
	#Range: 1 ~ 100
	loanDefaultThreshold = 3
	#How often banks pay depositor interest, in game ticks (72000 = 1 real hour at 20 TPS)
	#Range: 1200 ~ 9223372036854775807
	bankInterestPeriodTicks = 72000
	#How often loan interest accrues, in game ticks (72000 = 1 real hour)
	#Range: 1200 ~ 9223372036854775807
	loanInterestAccrualPeriodTicks = 72000
	#Default interest rate charged on loans per accrual period (0.05 = 5%)
	#Range: 0.0 ~ 1.0
	defaultLoanInterestRate = 0.05
	#Default interest rate paid to depositors per interest period (0.02 = 2%)
	#Range: 0.0 ~ 1.0
	defaultDepositInterestRate = 0.02
	#Fee to register a bank company (higher than a standard company, 0 = free)
	#Range: 0.0 ~ 1.7976931348623157E308
	bankRegistrationFee = 5000.0

#Marketplace Settings
#Configuration for the player-to-player marketplace system.
#Marketplace blocks let players list items for sale globally.
#Sales tax is based on seller's citizenship, import tariffs on buyer's nation.
[marketplace]
	#Enable the marketplace system
	enabled = true
	#Maximum number of active listings per player (0 = unlimited)
	#Range: 0 ~ 1000
	maxListingsPerPlayer = 20
	#Listing fee — percentage of listed price charged to seller on listing (deposited to city treasury).
	#0.01 = 1%. Set to 0 for no listing fee.
	#Range: 0.0 ~ 1.0
	listingFeePct = 0.01
	#How long listings stay active before expiring, in hours (0 = never expire).
	#Default: 168 hours (1 week).
	#Range: 0 ~ 8760
	listingExpirationHours = 168
	#Maximum price per item (0 = unlimited)
	#Range: 0.0 ~ 1.7976931348623157E308
	maxPricePerItem = 0.0
	#Require marketplace blocks to be placed in claimed city chunks
	requireCityPlacement = true

